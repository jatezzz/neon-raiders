<!DOCTYPE html>
<html lang="es">
    <head>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
        <meta name="theme-color" content="#000000">
        <title>Neon Raiders: reto diario</title>
        <meta name="description" content="Un reto de arcade nuevo cada día, igual para todos. Juega gratis en el navegador, sin registro, y comparte tu resultado.">
        <!-- Every copy of the game points to the portal as the one address to share and to index. -->
        <link rel="canonical" href="https://games.johnandrestrujillo.com/play/neon-raiders">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="OpenArcade">
        <meta property="og:locale" content="es_EC">
        <meta property="og:title" content="Neon Raiders: reto diario">
        <meta property="og:description" content="Un reto de arcade nuevo cada día, igual para todos. Gratis, sin registro. ¿Superas mi puntaje?">
        <meta property="og:url" content="https://games.johnandrestrujillo.com/play/neon-raiders">
        <meta property="og:image" content="https://jatezzz.github.io/neon-raiders/og.png">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta name="twitter:card" content="summary_large_image">
        <link rel="stylesheet" type="text/css" href="css/core.css?v=20261122a">
        <link rel="stylesheet" type="text/css" href="css/typeography.css?v=20261122a">
        <style>
    
            /* Styling needed for a fullscreen canvas and no scrollbars. */
            body, html { 
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            }

            #starfield {
                width:100%;
                height:100%;
                z-index: -1;
                position: absolute;
                left: 0px;
                top: 0px;
            }
            #gamecontainer {
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100%;
                padding-top: env(safe-area-inset-top);
            }
            #gameCanvas {
                display: block;
                width: 800px;
                height: 600px;
                touch-action: none;
            }
            #info {
                max-width: 800px;
                margin-left: auto;
                margin-right: auto;
                padding: 0 12px;
                box-sizing: border-box;
            }
            /* Pause button on the corner of the game: the phone's "Esc". Only while a run is on or paused. */
            #stage { position: relative; line-height: 0; }
            #pauseBtn {
                display: none;
                position: absolute; top: 6px; right: 6px;
                width: 40px; height: 40px;
                border-radius: 8px;
                border: 2px solid rgba(255, 255, 255, 0.55);
                background: rgba(0, 0, 0, 0.45);
                color: #ffffff;
                font: bold 14px Arial, sans-serif; line-height: 1;
                touch-action: none;
                cursor: pointer;
            }
            #pauseBtn::before { content: '\275A\275A'; }
            body[data-state="PauseState"] #pauseBtn::before { content: '\25B6'; }
            body[data-state="PlayState"] #pauseBtn, body[data-state="PauseState"] #pauseBtn { display: block; }
            body.in-portal #pauseBtn { display: none !important; }      /* the portal has its own pause button */
            .touch-only { display: none; }

            /* Touch screens: on-screen pad, no page scrolling, zooming or text selection. */
            body.touch {
                touch-action: none;
                -webkit-user-select: none;
                user-select: none;
                -webkit-touch-callout: none;
                -webkit-tap-highlight-color: transparent;
            }
            body.touch .touch-only { display: block; }
            body.touch .desktop-only { display: none; }
            body.touch #info { font-size: 12px; }
            #touchpad {
                display: none;
                position: fixed;
                left: 0; right: 0; bottom: 0;
                padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
                box-sizing: border-box;
            }
            body.touch #touchpad { display: flex; justify-content: space-between; align-items: center; }
            #touchpad .move { display: flex; gap: 14px; }
            #touchpad .act { display: flex; gap: 12px; align-items: center; }
            #touchpad button.turbo {
                width: 58px; height: 58px;
                border-color: #ffdc3c; color: #ffdc3c;
                background: rgba(255, 220, 60, 0.12);
                font-size: 24px;
                box-shadow: 0 0 12px rgba(255, 220, 60, 0.5);
            }
            #touchpad button {
                width: 76px; height: 76px;
                border-radius: 50%;
                border: 3px solid #00f0ff;
                background: rgba(0, 240, 255, 0.10);
                color: #00f0ff;
                font: bold 28px sans-serif;
                touch-action: none;
                box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
            }
            #touchpad button.fire {
                width: 96px; height: 96px;
                border-color: #ff00c8;
                color: #ff00c8;
                background: rgba(255, 0, 200, 0.12);
                font-size: 17px;
                box-shadow: 0 0 14px rgba(255, 0, 200, 0.6);
            }
            #touchpad button.active { transform: scale(0.92); filter: brightness(1.6); }
            body.touch #info { margin-bottom: 120px; }
            #touchpad { pointer-events: none; }
            #touchpad button { pointer-events: auto; }
            /* Game-over screen: result, share button and one recommended game. */
            #gameover {
                position: fixed; left: 0; top: 0; right: 0; bottom: 0;
                z-index: 20;
                display: flex; justify-content: center; align-items: center;
                padding: 12px;
                box-sizing: border-box;
                background: rgba(0, 0, 0, 0.72);
                overflow-y: auto;
                touch-action: pan-y;
            }
            #gameover[hidden] { display: none; }
            #gameover .card {
                width: 100%; max-width: 340px;
                margin: auto;
                padding: 16px;
                box-sizing: border-box;
                border: 2px solid #00f0ff;
                border-radius: 14px;
                background: #05060f;
                box-shadow: 0 0 18px rgba(0, 240, 255, 0.45);
                color: #ffffff;
                text-align: center;
                font-family: Arial, sans-serif;
            }
            #gameover h2 { margin: 0 0 4px; font-size: 16px; font-weight: normal; color: #00f0ff; }
            #goScore { margin: 0; font-size: 46px; font-weight: bold; line-height: 1.1; }
            #goScore + small { color: #b0b0c0; }
            /* Result against a score to beat: one look for a win, one for a tie, one for a loss. */
            #goOutcome { margin: 6px 0 0; font-size: 24px; font-weight: bold; }
            #goJoke { margin: 2px 0 8px; font-size: 14px; color: #e8e8f0; font-style: italic; }
            #gameover.outcome-win .card { border-color: #00ff9c; box-shadow: 0 0 22px rgba(0, 255, 156, 0.55); }
            #gameover.outcome-win #goOutcome { color: #00ff9c; }
            #gameover.outcome-tie .card { border-color: #ffdc3c; box-shadow: 0 0 22px rgba(255, 220, 60, 0.5); }
            #gameover.outcome-tie #goOutcome { color: #ffdc3c; }
            #gameover.outcome-lose .card { border-color: #ff00c8; box-shadow: 0 0 22px rgba(255, 0, 200, 0.5); }
            #gameover.outcome-lose #goOutcome { color: #ff00c8; }
            #goMeta, #goBest { margin: 6px 0; font-size: 13px; color: #b0b0c0; }
            #goRow { margin: 6px 0; font-size: 20px; letter-spacing: 2px; }
            #gameover button, #gameover a.button {
                display: block; width: 100%;
                margin: 8px 0 0; padding: 12px;
                box-sizing: border-box;
                border-radius: 10px;
                border: 2px solid #00f0ff;
                background: rgba(0, 240, 255, 0.10);
                color: #00f0ff;
                font: bold 16px Arial, sans-serif;
                text-decoration: none;
                cursor: pointer;
            }
            #gameover button.primary {
                border-color: #ff00c8;
                background: #ff00c8;
                color: #05060f;
                box-shadow: 0 0 14px rgba(255, 0, 200, 0.6);
                font-size: 18px;
            }
            #goText {
                width: 100%; height: 86px; margin-top: 8px;
                box-sizing: border-box;
                border: 1px solid #334; border-radius: 8px;
                background: #0b0d1a; color: #ffffff;
                font: 13px Arial, sans-serif;
                resize: none;
                -webkit-user-select: text; user-select: text;
            }
            #goLinks { margin-top: 12px; padding-top: 10px; border-top: 1px solid #223; }
            #goLinks small { display: block; color: #b0b0c0; font-size: 12px; }
            #goRec {
                display: flex; align-items: center; gap: 10px;
                margin-top: 6px; padding: 10px;
                border: 2px solid #00ff9c; border-radius: 10px;
                background: rgba(0, 255, 156, 0.08);
                color: #ffffff; text-decoration: none; text-align: left;
            }
            #goRecEmoji { font-size: 30px; }
            #goRecTitle { display: block; font-weight: bold; color: #00ff9c; }
            #goRecHook { display: block; font-size: 12px; color: #b0b0c0; }
            #goMore { display: block; margin-top: 10px; font-size: 13px; color: #00f0ff; }
            @media (orientation: landscape) and (max-height: 480px) {
                #gameover .card { max-width: 560px; padding: 10px 14px; }
                #goScore { font-size: 30px; }
                #goRow, #goMeta { display: inline-block; margin: 2px 8px; }
                #gameover .actions { display: flex; gap: 8px; }
                #goLinks { margin-top: 8px; padding-top: 6px; }
            }

            /* Phone in landscape: game uses the full height, buttons on the sides. */
            @media (orientation: landscape) {
                body.touch #info { display: none; }
                body.touch #touchpad { top: 0; align-items: flex-end; }
                body.touch #touchpad .move { flex-direction: column; }
                body.touch #touchpad .act { flex-direction: column; }
            }
        </style>
    </head>
    <body>
        <div id="starfield"></div>
        <div id="gamecontainer">
            <div id="stage">
                <canvas id="gameCanvas"></canvas>
                <button type="button" id="pauseBtn" aria-label="Pausa"></button>
            </div>
        </div>
        <div id="info">
            <p class="desktop-only" data-i18n="info.desktop">Muévete con las flechas, dispara con Espacio y pausa con P.</p>
            <p class="touch-only" data-i18n="info.touch">Arrastra sobre el juego para moverte y toca para disparar.</p>
            <p><a id="todayLink" href="#" hidden onclick="NeonDaily.playToday(); return false;" data-i18n="info.today">jugar el reto de hoy</a><span id="todaySep" hidden> | </span><a id="muteLink" href="#" onclick="toggleMute(); return false;" data-i18n="info.mute">silenciar</a> |
                <a id="portalLink" href="https://games.johnandrestrujillo.com/play" data-i18n="info.portal">más juegos</a> |
                <a href="https://github.com/jatezzz/neon-raiders" data-i18n="info.source">código en GitHub</a> |
                <span data-i18n="info.based">basado en</span> <a href="https://github.com/dwmkerr/spaceinvaders">dwmkerr/spaceinvaders</a></p>
        </div>
        <div id="gameover" hidden role="dialog" aria-modal="true" aria-labelledby="goTitle">
            <div class="card">
                <h2 id="goTitle"></h2>
                <p id="goOutcome" hidden></p>
                <p id="goJoke" hidden></p>
                <p id="goScore"></p><small data-i18n="over.points">puntos</small>
                <div><p id="goRow"></p><p id="goMeta"></p></div>
                <p id="goBest"></p>
                <div class="actions">
                    <button type="button" id="goShare" class="primary" data-i18n="over.share">Compartir resultado</button>
                    <button type="button" id="goAgain" data-i18n="over.again">Jugar de nuevo</button>
                </div>
                <div id="goFallback" hidden>
                    <textarea id="goText" readonly aria-label="Resultado"></textarea>
                    <a id="goWhatsapp" class="button" target="_blank" rel="noopener" data-i18n="over.whatsapp">Enviar por WhatsApp</a>
                    <button type="button" id="goCopy" data-i18n="over.copy">Copiar texto</button>
                </div>
                <div id="goLinks">
                    <small data-i18n="over.try">Prueba también</small>
                    <a id="goRec" target="_top">
                        <span id="goRecEmoji"></span>
                        <span><span id="goRecTitle"></span><span id="goRecHook"></span></span>
                    </a>
                    <a id="goMore" target="_top"></a>
                </div>
            </div>
        </div>
        <div id="touchpad" aria-label="Touch controls">
            <div class="move">
                <button type="button" data-key="LEFT" aria-label="Move left">&#9664;</button>
                <button type="button" data-key="RIGHT" aria-label="Move right">&#9654;</button>
            </div>
            <div class="act">
                <button type="button" class="turbo" data-key="UP" aria-label="Turbo">&#9889;</button>
                <button type="button" class="fire" data-key="SPACE" aria-label="Fire" data-i18n="pad.fire">FUEGO</button>
            </div>
        </div>

        <script src="js/starfield.js?v=20261122a"></script>
        <script src="js/i18n.js?v=20261122a"></script>
        <script src="js/theme.js?v=20261122a"></script>
        <script src="js/daily.js?v=20261122a"></script>
        <script src="js/spaceinvaders.js?v=20261122a"></script>
        <script src="js/touch-controls.js?v=20261122a"></script>
        <script>

            //  Texts in the player's language (Spanish by default).
            NeonI18n.apply();
            document.getElementById('portalLink').href =
                NeonDaily.withUtm(NeonDaily.CONFIG.portal + '/play', 'game', 'footer');
            NeonDaily.trackArrival();
            if (NeonDaily.sharedDay) {          // playing a shared challenge of another day: offer today's
                document.getElementById('todayLink').hidden = false;
                document.getElementById('todaySep').hidden = false;
            }

            //  Create the starfield.
            var container = document.getElementById('starfield');
            var starfield = new Starfield();
            starfield.initialise(container);
            starfield.start();

            //  Setup the canvas.
            var canvas = document.getElementById("gameCanvas");
            //  Touch screens get a tighter canvas around the 400x300 play area, so the game is bigger on phones.
            var compact = TouchControls.isTouchDevice();
            canvas.width = compact ? 440 : 800;
            canvas.height = compact ? 360 : 600;

            //  Create the game.
            var game = new Game();

            //  Initialise it with the game canvas.
            game.initialise(canvas);

            //  Start the game.
            game.start();

            //  Listen for keyboard events.
            window.addEventListener("keydown", function keydown(e) {
                var keycode = e.which || window.event.keycode;
                //  Supress further processing of left/right/space (37/29/32)
                if(keycode == 37 || keycode == 39 || keycode == 32 || keycode == 38) {
                    e.preventDefault();
                }
                game.keyDown(keycode);

            });
            window.addEventListener("keyup", function keydown(e) {
                var keycode = e.which || window.event.keycode;
                game.keyUp(keycode);
            });

            //  Browsers keep audio suspended until the first user gesture (iOS stays silent otherwise).
            function unlockAudio() {
                var ac = game.sounds && game.sounds.audioContext;
                if (ac && ac.state === 'suspended') { ac.resume(); }
            }
            ['pointerdown', 'keydown', 'touchend'].forEach(function (ev) { window.addEventListener(ev, unlockAudio, { passive: true }); });

            //  Load the active theme (themes/current.json); the game starts right away with the built-in look.
            NeonTheme.load().then(function (theme) { game.theme = theme; });

            //  Pause: the corner button (the phone's "Esc"), and by itself when the page goes to the background.
            var pauseBtn = document.getElementById('pauseBtn');
            pauseBtn.setAttribute('aria-label', NeonI18n.t('pad.pause'));
            pauseBtn.addEventListener('pointerdown', function (e) {
                e.preventDefault(); e.stopPropagation();
                game.requestPause(!(game.currentState() instanceof PauseState));
            });
            if (NeonDaily.embedded && window.PortalSDK) { document.body.classList.add('in-portal'); }
            document.addEventListener('visibilitychange', function () {
                if (document.hidden) { game.requestPause(true); }
            });

            //  Touch controls and responsive scaling (js/touch-controls.js).
            var touchControls = new TouchControls(game, canvas);

            function toggleMute() {
                game.mute();
                document.getElementById("muteLink").innerText = NeonI18n.t(game.sounds.mute ? 'info.unmute' : 'info.mute');
            }
        </script>
    </body>
</html>
